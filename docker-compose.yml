services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lagom_bling}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-lagom_bling}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    profiles: ["lagom"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: lagom-bling:dev
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-lagom_bling}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: lagom-bling:dev
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    command: ["node", "apps/api/dist/index.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      LOG_LEVEL: info
      BLING_OAUTH_ENABLED: ${BLING_OAUTH_ENABLED:-false}
      BLING_CLIENT_ID: ${BLING_CLIENT_ID:-}
      BLING_CLIENT_SECRET: ${BLING_CLIENT_SECRET:-}
      BLING_REDIRECT_URI: ${BLING_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      BLING_RATE_LIMIT_PER_SECOND: ${BLING_RATE_LIMIT_PER_SECOND:-2}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-lagom_bling}
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "false"
      WRITE_ENABLED: "false"
      LAGOM_TO_BLING_ENABLED: "false"
      BLING_TO_LAGOM_ENABLED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: lagom-bling-web:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      # Substitui só esta variável; $host, $uri etc. do nginx ficam intactos.
      NGINX_ENVSUBST_FILTER: ^ADMIN_API_TOKEN$
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["lagom"]
    image: lagom-bling:dev
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    command: ["pnpm", "dev:worker"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SCHEDULER_ENABLED: "false"
      WRITE_ENABLED: "false"
      LAGOM_TO_BLING_ENABLED: "false"
      BLING_TO_LAGOM_ENABLED: "false"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
